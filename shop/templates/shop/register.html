{% extends "shop/base.html" %}
{% block title %}Реєстрація — FlowerBooM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="auth-card">
            <div class="auth-card-header">
                <i class="bi bi-person-plus fs-1 mb-2 d-block"></i>
                <h2 class="h4 mb-0">Створити акаунт</h2>
            </div>
            <div class="auth-card-body">

                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="form-label">Ім'я <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control"
                                   placeholder="Олена" required>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="form-label">Прізвище</label>
                            <input type="text" name="last_name" class="form-control"
                                   placeholder="Іваненко">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Логін <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Унікальний логін" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password1" class="form-control"
                                   placeholder="Мінімум 8 символів" required minlength="8">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Підтвердити пароль <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password2" class="form-control"
                                   placeholder="Повторіть пароль" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-person-check me-2"></i>Зареєструватися
                        </button>
                    </div>
                </form>

                <p class="text-center mb-0 small">
                    Вже маєте акаунт?
                    <a href="{% url 'login' %}" class="text-primary fw-semibold">Увійти</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
