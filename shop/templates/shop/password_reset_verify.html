{% extends "shop/base.html" %}
{% block title %}Введіть код — FlowerBooM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <div class="auth-card">
            <div class="auth-card-header">
                <i class="bi bi-shield-lock fs-1 mb-2 d-block"></i>
                <h2 class="h4 mb-0">Введіть код підтвердження</h2>
                {% if session_email %}
                    <p class="text-white-50 small mb-0 mt-1">Код надіслано на {{ session_email }}</p>
                {% endif %}
            </div>
            <div class="auth-card-body">

                <form action="{% url 'password_reset_verify' %}" method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ session_email }}" placeholder="your@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Код підтвердження</label>
                        <input type="text" name="code" class="form-control form-control-lg text-center fw-bold"
                               placeholder="000000" maxlength="6" required
                               style="font-size:1.5rem; letter-spacing:0.3rem;">
                        <div class="form-text text-center">
                            <i class="bi bi-clock me-1"></i>Код дійсний 15 хвилин
                        </div>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label class="form-label">Новий пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password1" class="form-control"
                                   placeholder="Мінімум 8 символів" required minlength="8">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Підтвердити пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password2" class="form-control"
                                   placeholder="Повторіть пароль" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-circle me-2"></i>Змінити пароль
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="{% url 'password_reset' %}" class="text-muted small">
                        <i class="bi bi-arrow-repeat me-1"></i>Надіслати код знову
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
