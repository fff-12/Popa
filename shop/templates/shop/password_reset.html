{% extends "shop/base.html" %}
{% block title %}Відновлення пароля — FlowerBooM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <div class="auth-card">
            <div class="auth-card-header">
                <i class="bi bi-key fs-1 mb-2 d-block"></i>
                <h2 class="h4 mb-0">Відновлення пароля</h2>
                <p class="text-white-50 small mb-0 mt-1">
                    Введіть email — надішлемо 6-значний код
                </p>
            </div>
            <div class="auth-card-body">

                <form action="{% url 'password_reset' %}" method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="your@email.com" required autofocus>
                        </div>
                        <div class="form-text">
                            <i class="bi bi-info-circle me-1"></i>
                            На цей email прийде код підтвердження (дійсний 15 хвилин).
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                            <i class="bi bi-send me-2"></i>Надіслати код
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-muted small">
                        <i class="bi bi-arrow-left me-1"></i>Повернутися до входу
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
